<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Window Dude — Hello World</title>
    <!-- TODO: real description before launch -->
    <meta name="description" content="Window Dude window cleaning — new site coming soon." />
    <meta name="robots" content="noindex" /><!-- TODO: remove at launch -->
  </head>
  <body>
    <header id="site-header"></header>

    <main>
      <!-- TEMP: hello-world deploy check. Replace with the real home page (TODO). -->
      <section class="section">
        <div class="container prose">
          <h1>Hello, world 👋</h1>
          <p>This is the new windowdude.com, deployed from GitHub.</p>

          <!-- Plain-HTML status: readable even if CSS/JS fail to load -->
          <p id="deploy-check" style="padding:12px;border-radius:8px;background:#fde8e8;color:#8a1c1c;font-weight:700;">
            ⚠️ JS did NOT load. If this box is red and the page looks unstyled, the
            /assets/ path is wrong for this URL (likely a /~username/ temp URL).
          </p>
          <p>Build: <strong id="build-stamp">unknown</strong></p>
          <p>Page URL: <code id="page-url"></code></p>

          <p><a class="btn btn--cta btn--lg" href="#quote" data-quote>Get a Quote</a></p>
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>

    <script type="module" src="/src/site.js"></script>
    <script type="module">
      const box = document.getElementById('deploy-check');
      box.textContent = '✅ JS loaded ✓ — CSS ' +
        (getComputedStyle(document.body).display === 'flex' ? 'loaded ✓' : 'did NOT load ✗');
      box.style.background = '#e3f5ea';
      box.style.color = '#1e5e37';
      document.getElementById('build-stamp').textContent = __BUILD_TIME__;
      document.getElementById('page-url').textContent = location.href;
    </script>
  </body>
</html>
